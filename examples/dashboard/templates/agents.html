{% extends "base.html" %}

{% block page_title %}Agents{% endblock %}
{% block page_subtitle %}Full list of agents observed by the demo loop.{% endblock %}

{% block content %}
<section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
  <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
    <div>
      <h2 class="text-base font-semibold text-slate-900">All agents</h2>
      <p class="text-xs text-slate-500 mt-0.5">Ordered by signal count, then agent id. Refreshed every 5 seconds.</p>
    </div>
  </header>
  <div hx-get="/api/agents-table"
       hx-trigger="load, every 5s"
       hx-swap="innerHTML">
    <div class="px-5 py-6 text-sm text-slate-400">Loading...</div>
  </div>
</section>
{% endblock %}
