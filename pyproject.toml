[project]
name = "conformal-margin"
version = "0.1.0.dev0"
description = "Fleet-level security monitoring for AI agent deployments with formal False-Positive-Rate guarantees via Conformal Prediction."
requires-python = ">=3.12"
authors = [
  { name = "Silency Technologies", email = "" },
]
license = { text = "Silency Non-Commercial v1.0" }
keywords = [
  "ai-security",
  "agent-monitoring",
  "conformal-prediction",
  "anomaly-detection",
  "drift-detection",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

dependencies = [
  "msgspec>=0.19,<1.0",
  "anyio>=4.0,<5.0",
  "structlog>=24.0,<26.0",
  "numpy>=2.0,<3.0",
  "scipy>=1.12,<2.0",
  "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
# Optional extras for runnable example demos under `/examples/`.
examples = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
]
llm-demo = [
  "smolagents>=1.0,<2.0",
  "transformers>=4.40,<5.0",
  "torch>=2.0,<3.0",
  "accelerate>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conformal_margin"]

[tool.hatch.build.targets.sdist]
include = [
  "src/conformal_margin",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "-ra",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"examples/dashboard/main.py" = ["E402"]
"examples/smolagents_demo/main.py" = ["E402"]
